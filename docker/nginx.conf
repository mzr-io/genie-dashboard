# Non-root nginx: no user directive, writable paths under /tmp, port 8080.
pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # $uri is rewritten to /index.php by try_files, so derive the original path from $request_uri,
    # without query string or fragment, so secrets in URLs never reach the access log.
    # An invitation or reset link carries its secret in the path: log it as /invitations/[token] or /reset-password/[token].
    map $request_uri $log_path {
        ~^/invitations/ /invitations/[token];
        ~^/reset-password/ /reset-password/[token];
        ~^(?<p>[^?#]*) $p;
        default $request_uri;
    }
    log_format scrubbed '$remote_addr [$time_local] "$request_method $log_path" $status $body_bytes_sent';
    access_log /dev/stdout scrubbed;
    sendfile on;
    server_tokens off;

    client_body_temp_path /tmp/nginx/body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;
        index index.php;
        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include /etc/nginx/fastcgi_params;
            fastcgi_hide_header X-Powered-By;
        }

        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}
