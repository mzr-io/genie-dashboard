; PgBouncer for the Database test suite: transaction pooling with ONE server connection,
; so two clients are forced to share the same PostgreSQL session.
[databases]
dashflow_test = host=postgres port=5432 dbname=dashflow_test

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = pgbouncer_admin
pool_mode = transaction
default_pool_size = 1
min_pool_size = 1
reserve_pool_size = 0
max_client_conn = 50
max_prepared_statements = 100
server_reset_query =
ignore_startup_parameters = extra_float_digits
